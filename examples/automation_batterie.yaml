# Beispiel: Meldung, wenn eine Kamera-Batterie niedrig wird.
# Voraussetzung: Experimentell-Funktion "events" ist eingeschaltet.
alias: Reolink Batterie niedrig
description: Sendet eine Nachricht, wenn Reolink Manager eine niedrige Batterie meldet.
triggers:
  - trigger: event
    event_type: reolink_manager_battery_low
actions:
  - action: notify.notify
    data:
      title: "Kamera-Batterie niedrig"
      message: "{{ trigger.event.data.name }}: {{ trigger.event.data.battery }} %"
mode: queued
