# Beispiel: Hinweis, wenn für ein Gerät ein Firmware-Update bereitsteht.
# Voraussetzung: Experimentell-Funktion "events" ist eingeschaltet.
alias: Reolink Firmware-Update verfügbar
description: Sendet eine Nachricht, wenn die Reolink-Integration ein Firmware-Update meldet.
triggers:
  - trigger: event
    event_type: reolink_manager_update_available
actions:
  - action: notify.notify
    data:
      title: "Reolink Firmware-Update"
      message: >-
        {{ trigger.event.data.name }}: {{ trigger.event.data.installed_version }}
        → {{ trigger.event.data.latest_version }}
mode: queued
