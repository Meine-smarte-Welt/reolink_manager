# Beispiel: Meldung, wenn eine Kamera offline geht (nach der eingestellten Verzögerung).
# Voraussetzung: Experimentell-Funktion "events" ist eingeschaltet.
alias: Reolink Kamera offline
description: Sendet eine Nachricht, wenn Reolink Manager ein Gerät als offline meldet.
triggers:
  - trigger: event
    event_type: reolink_manager_device_offline
actions:
  - action: notify.notify
    data:
      title: "Kamera offline"
      message: "{{ trigger.event.data.name }} ({{ trigger.event.data.model }}) ist offline."
mode: queued
